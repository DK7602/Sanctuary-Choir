name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      systems:
        description: Which systems to build
        type: choice
        options: [all, macOS, Windows, Linux]
        default: all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.name == 'macOS' && 'macos-15' || (matrix.name == 'Windows' && 'windows-2022' || 'ubuntu-24.04') }}
    strategy:
      fail-fast: false
      matrix:
        # A public repository's Actions minutes are free, so every push builds all three. A private
        # one's are limited (macOS minutes count ten times, Windows twice): pushes and pull requests
        # build only Windows, and the others are built by running the workflow by hand (pick the
        # system) or by a release tag.
        name: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && inputs.systems != 'all' && format('["{0}"]', inputs.systems)
          || (github.event.repository.private && github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')) && '["Windows"]'
          || '["macOS", "Windows", "Linux"]') }}

    steps:
      - uses: actions/checkout@v4

      # A script that does not parse leaves the plugin window blank and unscaled.
      - name: Check the UI scripts parse
        if: runner.os != 'macOS'
        shell: bash
        run: for f in ui/js/*.js; do node --check "$f"; done

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libegl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglu1-mesa-dev mesa-common-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -OutputDirectory C:/webview2 -NonInteractive

      # JUCE lives in its own cached folder that CMake uses as is (a cached copy inside build/
      # was deleted and cloned again by FetchContent on every run).
      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: .juce/JUCE
          key: juce-9.0.4-src-${{ runner.os }}

      - name: Fetch JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --depth 1 --branch 9.0.4 https://github.com/juce-framework/JUCE.git .juce/JUCE

      - name: Configure
        shell: bash
        run: |
          # The commit the build is of (a pull request's own head, not GitHub's merge commit).
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          case "$RUNNER_OS" in
            macOS)   ARGS=(-G Ninja "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0) ;;
            Windows) ARGS=(-DJUCE_WEBVIEW2_PACKAGE_LOCATION=C:/webview2) ;;
            *)       ARGS=(-G Ninja) ;;
          esac
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/.juce/JUCE" -DSANCTUARY_BUILD_ID="${SHA:0:7}" "${ARGS[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate plugin (pluginval)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   PV=pluginval_Linux.zip ;;
            macOS)   PV=pluginval_macOS.zip ;;
            Windows) PV=pluginval_Windows.zip ;;
          esac
          curl -sSfL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$PV"
          mkdir -p pv && (cd pv && cmake -E tar xf ../pv.zip)
          VST3="build/plugin/SanctuaryChoir_artefacts/Release/VST3/Sanctuary Choir.vst3"
          case "$RUNNER_OS" in
            Linux)   xvfb-run -a ./pv/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process --validate "$VST3" ;;
            macOS)   ./pv/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process --validate "$VST3" ;;
            Windows) ./pv/pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process --validate "$VST3" ;;
          esac

      - name: Validate Audio Unit (auval)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ART=build/plugin/SanctuaryChoir_artefacts
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ART/Release/AU/Sanctuary Choir.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i sanctuary || true
          auval -strict -v aumf SChr Snct

      - name: Package
        shell: bash
        run: |
          VERSION=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          OUT="Sanctuary-Choir-${{ matrix.name }}"
          mkdir -p "dist/$OUT"
          ART=build/plugin/SanctuaryChoir_artefacts
          REL="$ART/Release"
          cp -R "$REL/VST3/Sanctuary Choir.vst3" "dist/$OUT/"
          cp -R voices/SanctuaryVoices "dist/$OUT/SanctuaryVoices"
          cp packaging/INSTALL-${{ matrix.name }}.txt "dist/$OUT/INSTALL.txt"
          cp rooms/CREDITS.txt "dist/$OUT/ROOMS-CREDITS.txt"
          cp LICENSE "dist/$OUT/LICENSE.txt"
          case "$RUNNER_OS" in
            macOS)   python3 tools/notices/collect_notices.py .juce/JUCE "dist/$OUT/THIRD-PARTY-NOTICES.txt" --platform macos ;;
            Windows) python tools/notices/collect_notices.py .juce/JUCE "dist/$OUT/THIRD-PARTY-NOTICES.txt" --platform windows --webview2 C:/webview2 ;;
            *)       python3 tools/notices/collect_notices.py .juce/JUCE "dist/$OUT/THIRD-PARTY-NOTICES.txt" --platform linux ;;
          esac
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$REL/AU/Sanctuary Choir.component" "dist/$OUT/"
            cp -R "$REL/Standalone/Sanctuary Choir.app" "dist/$OUT/"
            # Ad-hoc signature so the bundles load on Apple Silicon.
            for b in "dist/$OUT/"*.vst3 "dist/$OUT/"*.component "dist/$OUT/"*.app; do codesign --force --deep --sign - "$b"; done
            packaging/macos/build_pkg.sh "dist/$OUT" "$VERSION" "dist/$OUT"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp "$REL/Standalone/Sanctuary Choir.exe" "dist/$OUT/"
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
            "$ISCC" //Q "//DAppVersion=$VERSION" "//DSourceDir=$(cygpath -w "$PWD/dist/$OUT")" "//O$(cygpath -w "$PWD/dist/$OUT")" packaging/windows/SanctuaryChoir.iss
          else
            cp "$REL/Standalone/Sanctuary Choir" "dist/$OUT/"
          fi
          ls -la "dist/$OUT"
          cd dist && cmake -E tar cf "$OUT.zip" --format=zip "$OUT"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Choir-${{ matrix.name }}
          path: dist/Sanctuary-Choir-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
